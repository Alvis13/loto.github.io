<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bốc Bài Sổ Xố - Giao Diện Game Đỉnh Cao</title>
    <style>
        /* --- ẨN THANH CUỘN CHO TOÀN TRANG --- */
        * {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
        *::-webkit-scrollbar {
            display: none !important; 
        }
        
        /* CSS CHUNG */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e272e;
            margin: 0;
            padding: 20px 10px;
            color: white;
            user-select: none; 
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            font-size: 24px;
        }

        .tabs-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto 20px auto;
            position: relative;
        }

        .tabs {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding: 5px 0 10px 0;
            scroll-behavior: smooth;
        }

        .tab {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            color: #bdc3c7;
            background-color: #2c3e50;
            border: 2px solid #34495e;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap; 
            flex-shrink: 0; 
        }

        .tab.active {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
            box-shadow: 0 4px 8px rgba(231, 76, 60, 0.4);
        }

        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .result-board {
            background-color: #fff;
            padding: 15px 10px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-size: 26px;
            font-weight: bold;
            color: #e74c3c;
            letter-spacing: 5px;
            margin-bottom: 15px;
            border: 3px solid #f1c40f;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-sizing: border-box;
        }

        .instruction {
            font-size: 16px;
            margin-bottom: 15px;
            color: #bdc3c7;
            text-align: center;
            height: 20px; 
        }

        /* ---------------------------------------------------
           CONTAINER CHỨA BÀI & NÚT RESET OVERLAY
           --------------------------------------------------- */
        .board-container {
            position: relative; 
            width: 100%;
            display: flex;
            justify-content: center;
            min-height: 300px; 
        }

        .board {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            width: 100%;
            transition: filter 0.6s ease; 
        }

        /* Class thêm vào khi game kết thúc */
        .board.dimmed {
            filter: blur(1px) brightness(0.4);
            pointer-events: none; 
        }

        @keyframes popUpOverlay {
            0% { transform: translate(-50%, -30%) scale(0.8); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

button.reset-btn {
            position: absolute; 
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            padding: 20px;
            font-size: 26px; /* Phóng to chữ lên một chút vì không còn khung */
            font-weight: 900;
            color: #fff; /* Chữ màu trắng */
            background-color: transparent; /* Nền hoàn toàn trong suốt */
            border: none; /* Không viền */
            cursor: pointer;
            display: none;
            text-transform: uppercase;
            width: 100%;
            text-align: center;
            letter-spacing: 4px;
            /* Tạo hiệu ứng bóng đổ và phát sáng xung quanh chữ */
            text-shadow: 0 5px 15px rgba(0,0,0,0.9), 0 0 20px rgba(255, 255, 255, 0.6);
            transition: color 0.3s, text-shadow 0.3s, transform 0.2s;
            -webkit-tap-highlight-color: transparent; /* Tắt nháy xanh khi bấm trên điện thoại */
        }

        button.reset-btn.show {
            animation: popUpOverlay 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
        }

        /* Khi người dùng di chuột vào hoặc chạm tay trên màn hình */
        button.reset-btn:hover { 
            color: #f1c40f; /* Chữ chuyển sang màu vàng gold */
            text-shadow: 0 5px 15px rgba(0,0,0,0.9), 0 0 30px rgba(241, 196, 15, 0.9);
        }
        
        button.reset-btn:active { 
            transform: translate(-50%, -48%) scale(0.95); 
        }

        /* ĐỊNH DẠNG LÁ BÀI */
        .card { width: 45px; height: 65px; background-color: transparent; perspective: 1000px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card.disabled { cursor: not-allowed; opacity: 0.35; }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        .card-front { background-color: #34495e; color: #95a5a6; border: 1px solid #2c3e50; background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,0.05) 5px, rgba(255,255,255,0.05) 10px); }
        .card-back { background-color: #ecf0f1; color: #7f8c8d; transform: rotateY(180deg); border: 2px solid #bdc3c7; }
        .card.user-picked .card-back { background-color: #fffacd; color: #c0392b; border: 2px solid #f1c40f; box-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
        .card-front.sub-front { background-color: #c0392b; border-color: #922b21; color: #e6b0aa; }
        .card.user-picked.sub-card .card-back { background-color: #fef9e7; color: #d35400; border: 2px solid #e67e22; }

        /* NGĂN KÉO LỊCH SỬ */
        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.6); z-index: 998; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .overlay.active { opacity: 1; pointer-events: auto; }
        .history-toggle { position: fixed; top: 50%; right: 0; transform: translateY(-50%); background-color: #e74c3c; color: white; padding: 15px 8px 15px 12px; border-radius: 15px 0 0 15px; box-shadow: -2px 0 10px rgba(0,0,0,0.3); cursor: pointer; z-index: 997; font-size: 18px; transition: right 0.3s ease; }
        .history-toggle:hover { background-color: #c0392b; }
        .history-sidebar { position: fixed; top: 0; right: -320px; width: 280px; height: 100vh; background-color: #2c3e50; box-shadow: -5px 0 15px rgba(0,0,0,0.5); z-index: 999; transition: right 0.3s cubic-bezier(0.4, 0.0, 0.2, 1); display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        .history-sidebar.open { right: 0; }
        .history-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #34495e; padding-bottom: 10px; margin-bottom: 15px; }
        .history-sidebar h3 { margin: 0; color: #f1c40f; }
        .close-btn { background: transparent; border: none; color: #bdc3c7; font-size: 24px; cursor: pointer; padding: 0 5px; }
        .history-list { list-style-type: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        .history-list li { background-color: #1e272e; margin-bottom: 10px; padding: 12px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; color: #ecf0f1; display: flex; flex-direction: column; gap: 5px; }
        .region-tag { font-size: 12px; color: #f39c12; text-transform: uppercase; }
        .number-tag { letter-spacing: 2px; color: #2ecc71; }

        @media (max-width: 480px) {
            .card { width: 40px; height: 58px; }
            .card-front, .card-back { font-size: 18px; }
            .board > div { gap: 6px !important; }
            .result-board { font-size: 20px; letter-spacing: 3px; }
            .history-sidebar { width: 260px; right: -260px; }
            button.reset-btn { font-size: 16px; padding: 15px 25px; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleHistory()"></div>

    <div class="history-toggle" id="history-toggle" onclick="toggleHistory()">
        &#10094;
    </div>

    <div class="history-sidebar" id="history-sidebar">
        <div class="history-header">
            <h3>Lịch sử quay</h3>
            <button class="close-btn" onclick="toggleHistory()">&#10006;</button>
        </div>
        <ul class="history-list" id="history-list"></ul>
    </div>

    <div class="app-container">
        <h2>Bốc Số Trực Quan</h2>
        
        <div class="tabs-container">
            <div class="tabs" id="tabs-bar">
                <button id="tab-mb" class="tab active" onclick="switchMode('digit', 5, 9, 'Miền Bắc')">Miền Bắc</button>
                <button id="tab-mn" class="tab" onclick="switchMode('digit', 6, 9, 'Miền Nam')">Miền Nam</button>
                <button id="tab-max3d" class="tab" onclick="switchMode('max3d', 6, 9, '3D+ / 3D Pro')">3D+ / 3D Pro</button>
                <button id="tab-mega" class="tab" onclick="switchMode('lotto', 6, 45, 'Mega 6/45')">Mega 6/45</button>
                <button id="tab-power" class="tab" onclick="switchMode('lotto', 6, 55, 'Power 6/55')">Power 6/55</button>
                <button id="tab-loto35" class="tab" onclick="switchMode('lotto-sub', 5, 35, 'Loto 5/35', 1, 12)">Loto 5/35 + Phụ</button>
            </div>
        </div>

        <div class="result-board" id="result-display"></div>
        <div class="instruction" id="instruction"></div>
        
        <!-- WRAPPER CHỨA BÀI VÀ NÚT OVERLAY -->
        <div class="board-container">
            <div class="board" id="board"></div>
            <!-- Nút Reset lơ lửng -->
            <button id="reset-btn" class="reset-btn" onclick="initGame()">Chơi tiếp ván mới</button>
        </div>
        
    </div>

    <script>
        const historySidebar = document.getElementById('history-sidebar');
        const overlay = document.getElementById('overlay');
        const historyToggleBtn = document.getElementById('history-toggle');

        function toggleHistory() {
            historySidebar.classList.toggle('open');
            overlay.classList.toggle('active');
            if (historySidebar.classList.contains('open')) {
                historyToggleBtn.style.right = '-50px'; 
            } else {
                historyToggleBtn.style.right = '0';
            }
        }

        const board = document.getElementById('board');
        const resultDisplay = document.getElementById('result-display');
        const instruction = document.getElementById('instruction');
        const resetBtn = document.getElementById('reset-btn');
        const historyList = document.getElementById('history-list');
        
        let pickedNumbers = [];
        let pickedSubNumbers = [];
        let cardElements = [];
        let subCardElements = [];
        
        let currentType = 'digit'; 
        let currentPicks = 5; 
        let currentMaxPool = 9; 
        let currentRegion = 'Miền Bắc';
        let currentSubPicks = 0;
        let currentMaxSubPool = 0;

        function switchMode(type, picks, maxPool, regionName, subPicks = 0, maxSubPool = 0) {
            currentType = type;
            currentPicks = picks;
            currentMaxPool = maxPool;
            currentRegion = regionName;
            currentSubPicks = subPicks;
            currentMaxSubPool = maxSubPool;

            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            if (regionName === 'Miền Bắc') document.getElementById('tab-mb').classList.add('active');
            if (regionName === 'Miền Nam') document.getElementById('tab-mn').classList.add('active');
            if (regionName === '3D+ / 3D Pro') document.getElementById('tab-max3d').classList.add('active');
            if (regionName === 'Mega 6/45') document.getElementById('tab-mega').classList.add('active');
            if (regionName === 'Power 6/55') document.getElementById('tab-power').classList.add('active');
            if (regionName === 'Loto 5/35') document.getElementById('tab-loto35').classList.add('active');
            
            const activeTab = document.querySelector('.tab.active');
            const tabsBar = document.getElementById('tabs-bar');
            if(activeTab) {
                tabsBar.scrollLeft = activeTab.offsetLeft - (tabsBar.offsetWidth / 2) + (activeTab.offsetWidth / 2);
            }

            initGame();
        }

        function formatNumber(num) {
            if (currentType.includes('lotto')) { return num < 10 ? '0' + num : num.toString(); }
            return num.toString();
        }

        function updateDisplay() {
            let mainArr = pickedNumbers.map(n => formatNumber(n));
            
            if (currentType === 'max3d') {
                while(mainArr.length < currentPicks) mainArr.push('_');
                let part1 = mainArr.slice(0, 3).join('');
                let part2 = mainArr.slice(3, 6).join('');
                resultDisplay.innerHTML = `${part1} <span style="color:#f1c40f">-</span> ${part2}`;
            } 
            else if (currentType === 'lotto-sub') {
                while(mainArr.length < currentPicks) mainArr.push('__');
                let mainStr = mainArr.join(' ');
                
                let subArr = pickedSubNumbers.map(n => formatNumber(n));
                while(subArr.length < currentSubPicks) subArr.push('__');
                let subStr = subArr.join(' ');
                
                resultDisplay.innerHTML = mainStr + ' <span style="color: #f1c40f">|</span> ' + subStr;
            } 
            else {
                let pad = currentType === 'digit' ? '_' : '__';
                while(mainArr.length < currentPicks) mainArr.push(pad);
                resultDisplay.textContent = mainArr.join(' ');
            }
        }

        function createDeck(maxNum, isSub = false) {
            let pool = [];
            
            if ((currentType === 'digit' || currentType === 'max3d') && !isSub) {
                for (let i = 0; i < currentPicks; i++) {
                    for (let j = 0; j <= 9; j++) { pool.push(j); }
                }
            } else { 
                for (let i = 1; i <= maxNum; i++) { pool.push(i); }
            }

            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            const poolContainer = document.createElement('div');
            poolContainer.style.display = 'flex';
            poolContainer.style.flexWrap = 'wrap';
            poolContainer.style.justifyContent = 'center';
            poolContainer.style.gap = '8px';
            poolContainer.style.width = '100%';

            if (isSub) {
                const title = document.createElement('div');
                title.style.width = '100%';
                title.style.textAlign = 'center';
                title.style.color = '#f1c40f';
                title.style.margin = '10px 0 5px 0';
                title.style.fontSize = '14px';
                title.style.fontWeight = 'bold';
                title.textContent = '🔮 SỐ PHỤ 🔮';
                board.appendChild(title);
            }

            pool.forEach((number) => {
                const card = document.createElement('div');
                card.classList.add('card');
                if (isSub) card.classList.add('sub-card'); 
                
                let displayValue = formatNumber(number);

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front ${isSub ? 'sub-front' : ''}">?</div>
                        <div class="card-back">${displayValue}</div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    let targetArray = isSub ? pickedSubNumbers : pickedNumbers;
                    let targetMax = isSub ? currentSubPicks : currentPicks;

                    if (targetArray.length < targetMax && !card.classList.contains('flipped')) {
                        card.classList.add('flipped');
                        card.classList.add('user-picked');
                        targetArray.push(number);
                        
                        updateDisplay();

                        let mainDone = pickedNumbers.length === currentPicks;
                        let subDone = currentType === 'lotto-sub' ? pickedSubNumbers.length === currentSubPicks : true;

                        if (mainDone && subDone) {
                            endGame();
                        }
                    }
                });

                if (isSub) { subCardElements.push(card); } else { cardElements.push(card); }
                poolContainer.appendChild(card);
            });

            board.appendChild(poolContainer);
        }

        function initGame() {
            // Đặt lại hiệu ứng về trạng thái ban đầu
            board.classList.remove('dimmed');
            resetBtn.classList.remove('show');
            resetBtn.style.display = 'none';

            board.innerHTML = '';
            pickedNumbers = [];
            pickedSubNumbers = [];
            cardElements = [];
            subCardElements = [];
            
            updateDisplay();
            
            if (currentType === 'lotto-sub') {
                instruction.textContent = `Bốc ${currentPicks} số chính và ${currentSubPicks} số phụ!`;
            } else if (currentType === 'max3d') {
                instruction.textContent = `Hãy bốc 6 lá bài (2 bộ 3 số)!`;
            } else {
                instruction.textContent = `Hãy bốc ${currentPicks} lá bài bất kỳ!`;
            }
            
            instruction.style.color = '#bdc3c7';

            createDeck(currentMaxPool, false);
            if (currentType === 'lotto-sub') { createDeck(currentMaxSubPool, true); }
        }

        function endGame() {
            instruction.textContent = 'Tuyệt vời! Kết quả của bạn:';
            instruction.style.color = '#f1c40f';

            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });

            let allCards = [...cardElements, ...subCardElements];
            
            allCards.forEach((card, index) => {
                if (!card.classList.contains('user-picked')) {
                    setTimeout(() => {
                        card.classList.add('flipped');
                        card.classList.add('disabled');
                    }, index * (currentType.includes('lotto') ? 8 : 12)); 
                }
            });

            // Ép nút hiển thị và bật hiệu ứng nảy (pop-up)
            setTimeout(() => {
                board.classList.add('dimmed');
                resetBtn.style.display = 'block'; // Bắt buộc phải có lệnh này
                resetBtn.classList.add('show');
            }, 800); 

            let finalNumberString = "";
            
            if (currentType === 'digit') {
                finalNumberString = pickedNumbers.join('');
            } 
            else if (currentType === 'max3d') {
                let part1 = pickedNumbers.slice(0, 3).join('');
                let part2 = pickedNumbers.slice(3, 6).join('');
                finalNumberString = `${part1} - ${part2}`;
            } 
            else {
                let sortedPicks = [...pickedNumbers].sort((a, b) => a - b);
                finalNumberString = sortedPicks.map(n => formatNumber(n)).join(' - ');
                
                if (currentType === 'lotto-sub') {
                    let sortedSub = [...pickedSubNumbers].sort((a, b) => a - b);
                    finalNumberString += ` <span style="color: #f1c40f;">| ${sortedSub.map(n => formatNumber(n)).join(' - ')}</span>`;
                }
            }

            const newHistoryItem = document.createElement('li');
            newHistoryItem.innerHTML = `
                <span class="region-tag">[${currentRegion}]</span>
                <span class="number-tag" style="letter-spacing: ${currentType.includes('lotto') ? '1px' : '4px'};">${finalNumberString}</span>
            `;
            
            historyList.prepend(newHistoryItem);
        }

        initGame();
    </script>
</body>
</html>
